<header
  class="rise flex flex-wrap items-end justify-between gap-4 mb-6"
  style="animation-delay: 0ms"
>
  <div>
    <nav
      class="flex items-center gap-2 text-[11px] font-semibold tracking-[.14em] uppercase text-slate-400 mb-2"
    >
      <span>Dashboards</span>
      <span class="text-slate-300">/</span>
      <span class="text-[#1E5AA8]">Electoral</span>
    </nav>
    <h1 class="text-[26px] sm:text-[32px] font-bold text-[#0B2545] leading-tight">
      Panel de Control Electoral
    </h1>
    <p class="text-sm text-slate-500 mt-1">
      Bienvenido, <strong class="text-[#0B2545] font-semibold">{{ userName() }}</strong>
      <span class="mx-2 text-slate-300">·</span>
      {{ userRole() }}
      <span class="mx-2 text-slate-300">·</span>
      Corte {{ timeLabel(lastUpdate()) }}
    </p>
  </div>

  <div class="flex flex-wrap items-center gap-2.5">
    @if (demoMode()) {
      <span
        class="inline-flex items-center gap-1.5 h-9 px-3 rounded-lg text-xs font-semibold text-[#B26A00] bg-[#F5A623]/15 border border-[#F5A623]/30"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 9v2m0 4h.01M5.07 19h13.86c1.54 0 2.5-1.67 1.73-3L13.73 4a2 2 0 00-3.46 0L3.34 16c-.77 1.33.19 3 1.73 3z"
          />
        </svg>
        Datos de demostración
      </span>
    } @else {
      <span
        class="inline-flex items-center gap-1.5 h-9 px-3 rounded-lg text-xs font-semibold text-[#15803D] bg-[#22C55E]/15 border border-[#22C55E]/30"
      >
        <span class="w-1.5 h-1.5 rounded-full bg-[#22C55E]"></span>
        API conectada
      </span>
    }

    <!-- <button
      type="button"

      [class.live-on]="liveMode()"
      [attr.aria-pressed]="liveMode()"
    >
      <span class="live-dot" [class.on]="liveMode()"></span>
      {{ liveMode() ? 'Jornada en vivo' : 'Simular jornada' }}
    </button> -->

    >
      <svg
        width="18"
        height="18"
        [class.spin]="isLoading()"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
        />
      </svg>
    </button> -->

    <button
      type="button"
      (click)="exportCsv.emit()"
      class="inline-flex items-center gap-2 h-9 px-3.5 rounded-lg text-xs font-semibold text-white bg-[#0B2545] hover:bg-[#1E5AA8] transition-colors shadow-sm"
    >
      <svg
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
        />
      </svg>
      Exportar CSV
    </button>
  </div>
</header>
