<div class="flex min-h-screen w-full font-sans">
  <!-- PANEL IZQUIERDO: BRANDING (60% - Oculto en móviles) -->
  <div
    class="hidden lg:flex lg:w-[60%] bg-[#0B2545] relative overflow-hidden flex-col justify-between p-12 text-white"
  >
    <!-- Patrón de fondo sutil (Nodos de red) -->
    <div class="absolute inset-0 opacity-10">
      <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="1" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />
      </svg>
    </div>

    <!-- Logo y Slogan -->
    <div class="relative z-10">
      <div class="flex items-center gap-3 mb-4">
        <img src="assets/logo-full-elector.jfif" alt="Logo Elector" class="h-20 w-auto" />
      </div>
    </div>

    <div class="relative z-10 max-w-lg">
      <h2 class="text-5xl font-bold mb-6 leading-tight">
        Gestión electoral <br />
        <span class="text-[#F5A623]">inteligente.</span>
      </h2>
      <p class="text-xl text-gray-300 mb-8">"DATOS CLAROS, PODER REAL"</p>
      <div class="flex gap-6 text-sm text-gray-400">
        <div class="flex items-center gap-2">
          <svg class="w-5 h-5 text-[#F5A623]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"
            ></path>
          </svg>
          Seguridad de datos
        </div>
        <div class="flex items-center gap-2">
          <svg class="w-5 h-5 text-[#F5A623]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 10V3L4 14h7v7l9-11h-7z"
            ></path>
          </svg>
          Tiempo real
        </div>
      </div>
    </div>

    <div class="relative z-10 text-xs text-gray-500">
      © 2026 Elector. Todos los derechos reservados.
    </div>
  </div>

  <!-- PANEL DERECHO: FORMULARIO (40% / 100% en móvil) -->
  <div class="w-full lg:w-[40%] flex items-center justify-center p-8 bg-white">
    <div class="w-full max-w-md">
      <div class="mb-8">
        <h3 class="text-3xl font-bold text-[#0B2545] mb-2">Bienvenido</h3>
        <p class="text-gray-500">Ingresa tus credenciales para acceder al sistema.</p>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-6">
        <!-- Mensaje de Error -->
        @if (errorMessage) {
          <div
            class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm animate-shake"
          >
            {{ errorMessage }}
          </div>
        }

        <!-- Campo Cédula -->
        <div>
          <label for="cedula" class="block text-sm font-medium text-gray-700 mb-2">
            Cédula de Ciudadanía
          </label>
          <input
            id="cedula"
            name="cedula"
            type="text"
            [(ngModel)]="cedula"
            required
            placeholder="Ej: 1234567890"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-[#1E5AA8] focus:ring-2 focus:ring-[#1E5AA8]/20 outline-none transition-all"
          />
        </div>

        <!-- Campo Contraseña -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            Contraseña
          </label>
          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            required
            placeholder="••••••••"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-[#1E5AA8] focus:ring-2 focus:ring-[#1E5AA8]/20 outline-none transition-all"
          />
        </div>

        <!-- Botón de Envío -->
        <button
          type="submit"
          [disabled]="isLoading || !loginForm.form.valid"
          class="w-full bg-[#0B2545] hover:bg-[#1E5AA8] text-white font-semibold py-3 rounded-lg transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
        >
          @if (isLoading) {
            <svg
              class="animate-spin h-5 w-5 text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            <span>Validando...</span>
          } @else {
            <span>Ingresar al Sistema</span>
          }
        </button>
      </form>
    </div>
  </div>
</div>
