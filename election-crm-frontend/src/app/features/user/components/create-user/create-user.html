<div class="form-container">
  <h2>Crear Nuevo Usuario</h2>
  <p class="subtitle">Gestión de Líderes y Administradores del CRM</p>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Nombre Completo</label>
      <input type="text" [(ngModel)]="nombre" name="nombre" required placeholder="Ej: Juan Pérez" />
    </div>

    <div class="form-group">
      <label>Correo Electrónico</label>
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        required
        placeholder="correo@ejemplo.com"
      />
    </div>

    <div class="form-group">
      <label>Teléfono</label>
      <input
        type="text"
        [(ngModel)]="telefono"
        name="telefono"
        required
        placeholder="300 123 4567"
      />
    </div>

    <div class="form-group">
      <label>Municipio</label>
      <input
        type="text"
        [(ngModel)]="municipio"
        name="municipio"
        required
        placeholder="Ej: Barranquilla"
      />
    </div>

    <div class="form-group">
      <label>Cédula</label>
      <input type="text" [(ngModel)]="cedula" name="cedula" required placeholder="1234567890" />
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        required
        placeholder="Mínimo 6 caracteres"
      />
    </div>

    <div class="form-group">
      <label>Rol</label>
      <select [(ngModel)]="idRol" name="idRol">
        <option [value]="2">Líder</option>
        <option [value]="3">Coordinador</option>
      </select>
    </div>

    <button type="submit" class="btn-submit">Guardar Usuario</button>
  </form>

  @if (message) {
    <p class="alert" [class.alert-error]="isError" [class.alert-success]="!isError">
      {{ message }}
    </p>
  }

  <button (click)="router.navigate(['/dashboard'])" class="btn-back">Volver al Dashboard</button>
</div>
